name: Set up kiibohd build environment (macOS)
description: >-
  Installs the ARM toolchain, a usable CMake and the kll compiler needed by the
  Keyboards/ and Bootloader/ build scripts on a macOS runner.

inputs:
  python-version:
    description: >-
      Interpreter used to run the kll compiler and the host-side tests. CMake
      picks this up as `python3` from PATH.
    default: '3.12'

runs:
  using: composite
  steps:
  - uses: actions/setup-python@v7
    with:
      python-version: ${{ inputs.python-version }}

  - name: Install Homebrew dependencies
    shell: bash
    run: brew bundle

  # The runner image ships CMake 4, which dropped support for the
  # `cmake_minimum_required( VERSION 3.0 )` this tree still declares. The pip
  # wheel lands ahead of /usr/local/bin on PATH thanks to setup-python.
  - name: Pin CMake to a 3.x release
    shell: bash
    run: |
      python3 -m pip install 'cmake==3.31.6'
      cmake --version | head -1

  # Must come from this fork: the `kll` package on PyPI is a different project.
  - name: Install kll compiler
    shell: bash
    run: |
      python3 -m pip install --upgrade pip
      # kiibohd-kll still declares its metadata in the pre-PEP-621
      # [tool.flit.metadata] table, which flit_core 4 refuses to read. Provide a
      # 3.x backend and build against it directly.
      python3 -m pip install 'flit<4' 'flit_core<4'
      python3 -m pip install --no-build-isolation \
        git+https://github.com/MarkDrei/kiibohd-kll.git

  - name: Report toolchain versions
    shell: bash
    run: |
      cmake --version | head -1
      ninja --version
      clang --version | head -1
      arm-none-eabi-gcc --version | head -1
      python3 --version
      python3 -m kll --version
