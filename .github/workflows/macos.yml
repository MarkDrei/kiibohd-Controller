name: macOS Build Environment

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keyboards/cmake.bash refuses to run unless it believes a pipenv shell is
  # active. CI installs the kll compiler with pip instead, so satisfy the gate.
  PIPENV_ACTIVE: 1

jobs:
  firmware:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env-macos
    - name: Build
      working-directory: Keyboards
      run: ./ic_keyboards.bash

  firmware-test:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env-macos
    # AddressSanitizer's DYLD_INSERT_LIBRARIES preload does not survive into the
    # Python test harness on macOS, so the host tests run unsanitized here. The
    # Linux firmware-test job covers the sanitized case.
    - name: Test
      working-directory: Keyboards
      run: DisableSanitizer=true EnableHostOnlyBuild=true HostTest=kll.py ./ic_keyboards.bash

  other-firmware:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env-macos
    - name: Build
      working-directory: Keyboards/Others
      run: ./others.bash

  test-builds:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env-macos
    - name: Build
      working-directory: Keyboards/Testing
      run: DisableSanitizer=true ./all_tests.bash

  bootloaders:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env-macos
    - name: Build
      working-directory: Bootloader/Builds
      run: ./all.bash
