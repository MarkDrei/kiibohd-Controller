name: Linux Build Environment

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keyboards/cmake.bash refuses to run unless it believes a pipenv shell is
  # active. CI installs the kll compiler with pip instead, so satisfy the gate.
  PIPENV_ACTIVE: 1

jobs:
  firmware:
    # Pinned rather than ubuntu-latest: this tree still declares
    # `cmake_minimum_required( VERSION 3.0 )`, and CMake 4 removed compatibility
    # with anything below 3.5. 24.04 ships a 3.x CMake.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env
    - name: Build
      working-directory: Keyboards
      run: ./ic_keyboards.bash
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: Firmware
        path: Keyboards/firmware

  firmware-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env
    # Compiles each keyboard as a host shared library and drives it from Python
    # over ctypes. Runs with ASan/UBSan on, which is what EnableHostOnlyBuild
    # asks for by default.
    - name: Test
      working-directory: Keyboards
      run: EnableHostOnlyBuild=true HostTest=kll.py ./ic_keyboards.bash

  other-firmware:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env
    - name: Build
      working-directory: Keyboards/Others
      run: ./others.bash

  test-builds:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env
    - name: Build
      working-directory: Keyboards/Testing
      run: ./all_tests.bash

  bootloaders:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-build-env
    - name: Build
      working-directory: Bootloader/Builds
      run: ./all.bash
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: Bootloaders
        path: Bootloader/Builds/bootloader
