name: Release Environment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  # Keyboards/cmake.bash refuses to run unless it believes a pipenv shell is
  # active. CI installs the kll compiler with pip instead, so satisfy the gate.
  PIPENV_ACTIVE: 1

jobs:
  release:
    # See linux.yml: this tree needs a CMake 3.x.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        # githubaction_deploy.bash looks for a tag pointing at HEAD.
        fetch-depth: 0
    - uses: ./.github/actions/setup-build-env
    - name: Build
      working-directory: Lib/CMake
      run: ./githubaction_deploy.bash
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: Release Firmware
        path: Keyboards/firmware
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: Release Bootloader
        path: Bootloader/Builds/bootloader
        if-no-files-found: ignore
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        draft: true
        prerelease: true
        files: |
          Keyboards/firmware/*.dfu.bin
          Bootloader/Builds/bootloader/*.bootloader.bin
